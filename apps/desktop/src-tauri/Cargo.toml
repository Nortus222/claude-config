[package]
name = "nortuscc-desktop-validation"
version = "0.1.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
libc = "=0.2.183"
tauri-plugin-updater = "=2.13.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "=1.53.2", features = ["time", "sync", "macros"] }
semver = "=1.0.28"
base64 = "=0.23.1"
minisign-verify = "=0.3.0"
flate2 = "=1.1.10"
tar = "=0.4.46"
plist = "=1.10.1"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSError", "NSDate", "NSRunLoop", "NSThread"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse"] }
