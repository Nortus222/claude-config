# The suites do not pass on Windows yet, so this runs the files that do and that guard Windows
# process launching: .cmd shims through Processes, and a fresh setup through the fake installers.
name: windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  processes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test -w @nortuscc/hosted-protocol
      - run: node --test packages/machine/checks/processes.spec.ts
      - run: node --test --test-timeout=60000 test/fresh-machine.test.mjs

  # Unsigned local-overlay NSIS installer for manual testing: build and upload only, never released.
  desktop-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, Bun version fixed below
        with:
          bun-version: 1.3.14
      - run: npm ci
      - name: Fetch matching Bun license
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile, appendFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const response = await fetch('https://raw.githubusercontent.com/oven-sh/bun/bun-v1.3.14/LICENSE.md', { signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error('Bun license unavailable');
          const path = join(process.env.RUNNER_TEMP, 'bun-LICENSE.md');
          await writeFile(path, await response.text());
          await appendFile(process.env.GITHUB_ENV, `DESKTOP_BUN_LICENSE=${path}\n`);
          NODE
      - run: npm run desktop:build:windows -w apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: nortuscc-desktop-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
