name: linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Packaged-resource checks skip here: bundling is darwin-arm64 only and the macos job runs them.
      - run: npm run test:packages
