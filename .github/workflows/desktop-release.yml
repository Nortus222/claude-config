name: desktop-release

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Reviewed main SHA, equal to this workflow source SHA'
        required: true
        type: string
      version:
        description: 'Stable desktop version, already committed in package, Cargo and Tauri config'
        required: true
        type: string
      notes:
        description: 'Plain text release notes'
        required: true
        type: string

permissions: {}
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

env:
  REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_NOTES: ${{ inputs.notes }}
  DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATER_PUBLIC_KEY }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Nortus222/claude-config'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate reviewed source and create temporary release overlay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OVERLAY: ${{ runner.temp }}/desktop-release.json
        run: |
          test "$(uname -m)" = arm64
          node apps/desktop/scripts/release.ts overlay
          # Deliberately absent until the owner commits reviewed, tested Bun entitlements.
          test -f apps/desktop/release/bun-entitlements.plist
          plutil -lint apps/desktop/release/bun-entitlements.plist
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' apps/desktop/release/bun-entitlements.plist 2>/dev/null | grep -qx true; then exit 1; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, Bun version fixed below
        with:
          bun-version: 1.3.14
      - run: npm ci
      - name: Fetch matching Bun license
        run: |
          node --input-type=module <<'NODE'
          import { writeFile, appendFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const response = await fetch('https://raw.githubusercontent.com/oven-sh/bun/bun-v1.3.14/LICENSE.md', { signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error('Bun license unavailable');
          const path = join(process.env.RUNNER_TEMP, 'bun-LICENSE.md');
          await writeFile(path, await response.text());
          await appendFile(process.env.GITHUB_ENV, `DESKTOP_BUN_LICENSE=${path}\n`);
          NODE
      - name: Verify and build the reviewed release without bundling
        env:
          RELEASE_OVERLAY: ${{ runner.temp }}/desktop-release.json
        run: |
          npm run resources -w apps/desktop
          DESKTOP_AGENT_RESOURCES="$PWD/apps/desktop/src-tauri/resources/darwin-arm64" npm test -w apps/desktop
          npm run test:bun -w apps/desktop
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          npm run tauri -w apps/desktop -- build --no-bundle --config "$RELEASE_OVERLAY" -- --locked
      - name: Sign nested Bun, bundle, notarize and verify final distribution
        env:
          APPLE_CERTIFICATE: ${{ secrets.DESKTOP_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.DESKTOP_APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.DESKTOP_APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATER_PRIVATE_KEY_PASSWORD }}
          RELEASE_OVERLAY: ${{ runner.temp }}/desktop-release.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No signing, notarization or updater-signing fallback.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY; do
            test -n "${!name}"
          done
          [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application: '* ]]
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() { security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$RUNNER_TEMP/desktop-cert.p12" "$RUNNER_TEMP/AuthKey.p8"; }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/desktop-cert.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/desktop-cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          # Tauri signs the containing app; its Resources executables need explicit inner signing.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          bun="$PWD/apps/desktop/src-tauri/resources/darwin-arm64/bun"
          test "$(lipo -archs "$bun")" = arm64
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain" --entitlements apps/desktop/release/bun-entitlements.plist "$bun"
          codesign --verify --strict --verbose=2 "$bun"
          npm run tauri -w apps/desktop -- bundle --config "$RELEASE_OVERLAY" --bundles app,dmg
          app="$PWD/apps/desktop/src-tauri/target/release/bundle/macos/Nortuscc.app"
          dmg="$PWD/apps/desktop/src-tauri/target/release/bundle/dmg/Nortuscc_${RELEASE_VERSION}_aarch64.dmg"
          test "$(lipo -archs "$app/Contents/MacOS/nortuscc-desktop-validation")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/agent-runtime/bun"
          for binary in "$app" "$app/Contents/Resources/agent-runtime/bun"; do
            codesign --display --verbose=4 "$binary" 2> "$RUNNER_TEMP/signing-details.txt"
            grep -Eq '^CodeDirectory .*flags=.*runtime' "$RUNNER_TEMP/signing-details.txt"
            grep -Fx "Authority=$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/signing-details.txt"
            grep -q '^Timestamp=' "$RUNNER_TEMP/signing-details.txt"
            codesign --display --entitlements - "$binary" > "$RUNNER_TEMP/actual-entitlements.plist"
            if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$RUNNER_TEMP/actual-entitlements.plist" 2>/dev/null | grep -qx true; then exit 1; fi
          done
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # A DMG needs its own accepted notarization and ticket.
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RUNNER_TEMP/dmg-notarization.json"
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; if(JSON.parse(await readFile(process.env.RUNNER_TEMP+"/dmg-notarization.json","utf8")).status!=="Accepted") throw new Error("DMG notarization refused");'
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          export RELEASE_ARTIFACTS="$RUNNER_TEMP/desktop-release-artifacts"
          mkdir "$RELEASE_ARTIFACTS"
          cp "$PWD/apps/desktop/src-tauri/target/release/bundle/macos/Nortuscc.app.tar.gz" "$RELEASE_ARTIFACTS/"
          cp "$PWD/apps/desktop/src-tauri/target/release/bundle/macos/Nortuscc.app.tar.gz.sig" "$RELEASE_ARTIFACTS/"
          cp "$dmg" "$RELEASE_ARTIFACTS/"
          mkdir "$RUNNER_TEMP/release-payload"
          tar -xzf "$RELEASE_ARTIFACTS/Nortuscc.app.tar.gz" -C "$RUNNER_TEMP/release-payload"
          payload="$RUNNER_TEMP/release-payload/Nortuscc.app"
          codesign --verify --deep --strict --verbose=2 "$payload"
          xcrun stapler validate "$payload"
          spctl --assess --type execute --verbose=2 "$payload"
          test "$(lipo -archs "$payload/Contents/MacOS/nortuscc-desktop-validation")" = arm64
          test "$(lipo -archs "$payload/Contents/Resources/agent-runtime/bun")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$payload/Contents/Info.plist")" = "$RELEASE_VERSION"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const root = process.env.RUNNER_TEMP + '/release-payload/Nortuscc.app/Contents/Resources/agent-runtime/';
          const runtime = JSON.parse(await readFile(root + 'runtime.json', 'utf8'));
          const hash = createHash('sha256').update(await readFile(root + 'agent.mjs')).digest('hex');
          if (runtime.target !== 'darwin-arm64' || runtime.appVersion !== process.env.RELEASE_VERSION || runtime.maintenanceProtocol !== 1 || runtime.agentVersion !== hash) throw new Error('Signed bundle compatibility mismatch');
          NODE
          export RELEASE_VERIFIER="$payload/Contents/MacOS/nortuscc-desktop-validation"
          node apps/desktop/scripts/release.ts prepare
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_API_PRIVATE_KEY
          npm run smoke -w apps/desktop -- "$payload"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-desktop-release
          path: ${{ runner.temp }}/desktop-release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Nortus222/claude-config'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: reviewed-desktop-release
          path: ${{ runner.temp }}/desktop-release-artifacts
      - name: Reverify transferred signature and publish versioned artifacts then channel metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACTS: ${{ runner.temp }}/desktop-release-artifacts
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir "$RUNNER_TEMP/release-payload"
          tar -xzf "$RELEASE_ARTIFACTS/Nortuscc.app.tar.gz" -C "$RUNNER_TEMP/release-payload"
          export RELEASE_VERIFIER="$RUNNER_TEMP/release-payload/Nortuscc.app/Contents/MacOS/nortuscc-desktop-validation"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/release-payload/Nortuscc.app"
          xcrun stapler validate "$RUNNER_TEMP/release-payload/Nortuscc.app"
          node apps/desktop/scripts/release.ts publish
