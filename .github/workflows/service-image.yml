name: service-image

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Reviewed main commit (must equal this run source SHA)'
        required: true
        type: string

permissions: {}

concurrency:
  group: hosted-image
  cancel-in-progress: false

env:
  REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Nortus222/claude-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify reviewed source, existing protection and publication boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node apps/service/infra/release.ts image
      - name: Build reviewed image locally before approval
        run: |
          docker build --platform linux/amd64 --file apps/service/Dockerfile --tag nortuscc-service:review .

  publish:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Nortus222/claude-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: hosted-image
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reverify release after environment approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node apps/service/infra/release.ts image
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish reviewed immutable image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nortus222/claude-config-service:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Nortus222/claude-config
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record published digest
        env:
          PUBLISHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node apps/service/infra/release.ts published
