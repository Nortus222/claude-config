# Temporary: compares the root and package suites on macOS between main and this branch. Reverted before merge.
name: verify-unix

on:
  pull_request:

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run suites on base and head
        shell: bash
        run: |
          set +e -u +o pipefail
          head=$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)
          base=$(git merge-base origin/main "$head")
          suites() {
            dir=$1; out=$2
            (cd "$dir" && npm ci --no-audit --no-fund >/dev/null 2>&1 \
              && { npm test > "$out.cli" 2>&1; echo "cli exit $?"; } \
              && { npm run test --workspaces --if-present > "$out.pkg" 2>&1; echo "packages exit $?"; })
            cat "$out.cli" "$out.pkg" | grep -E '^(✖|not ok)' | sed -E 's/ \([0-9.]+m?s\)$//; s/^not ok [0-9]+ - /✖ /' | grep -v 'failing tests' | sort -u > "$out.fail"
          }
          git worktree add -q "$RUNNER_TEMP/base" "$base"
          git worktree add -q "$RUNNER_TEMP/head" "$head"
          echo "base $base"; suites "$RUNNER_TEMP/base" "$RUNNER_TEMP/b"
          echo "head $head"; suites "$RUNNER_TEMP/head" "$RUNNER_TEMP/h"
          for f in b h; do grep -E '^ℹ (tests|pass|fail|cancelled|skipped)' "$RUNNER_TEMP/$f.cli" "$RUNNER_TEMP/$f.pkg"; done
          echo "--- failing only on head:"; comm -13 "$RUNNER_TEMP/b.fail" "$RUNNER_TEMP/h.fail" | tee "$RUNNER_TEMP/new.txt"
          echo "--- failing only on base:"; comm -23 "$RUNNER_TEMP/b.fail" "$RUNNER_TEMP/h.fail"
          test ! -s "$RUNNER_TEMP/new.txt"
